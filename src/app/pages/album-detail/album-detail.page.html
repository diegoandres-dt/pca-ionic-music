<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>
    <ion-title>album-detail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="detail-content">
    <div class="detail-img">
      <img src="../../../assets/img/35.jpg">
    </div>
    <div class="datail-text">
      <ion-label class="titulo-label">Escape of the Phoenix</ion-label>
      <ion-label class="artista-label">Evergrey</ion-label>
      <ion-label class="detalle-lavel">METAL ·2021</ion-label>
    </div>
  </div>
  <div class="button-detail">
    <ion-button class="button-app-principal custom-button">
      <ion-icon slot="start" name="play"></ion-icon>
      Play
    </ion-button>
    <ion-button class="button-app-principal custom-button">
      <ion-icon slot="start" name="shuffle"></ion-icon>
      Shuffle
    </ion-button>
  </div>
 <ion-list class="track-list">
  <ion-item class="custom-item" lines="none">
    <ion-label>
      <span class="track-number">1</span> Forever Outsider
    </ion-label>
    <ion-icon name="cloud-download-outline" slot="end"></ion-icon>
  </ion-item>

  <ion-item class="custom-item" lines="none">
    <ion-label>
      <span class="track-number">2</span> Where August Mourn
    </ion-label>
    <ion-icon name="cloud-download-outline" slot="end"></ion-icon>
  </ion-item>

  <ion-item class="custom-item" lines="none">
    <ion-label>
      <span class="track-number">3</span> Stories
    </ion-label>
    <ion-icon name="cloud-download-outline" slot="end"></ion-icon>
  </ion-item>
</ion-list>
</ion-content>
