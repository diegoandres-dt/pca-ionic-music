<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Detalle Artista</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="detail-content">
    <div class="detail-img">
      <img [src]="infoArtista.image">
    </div>
    <div class="datail-text">
      <ion-label class="titulo-label">{{infoArtista.name}}</ion-label>
      <ion-label class="artista-label">{{infoArtista.popularity}}</ion-label>
      <ion-label class="detalle-lavel">{{infoArtista.followers}}</ion-label>
    </div>
  </div>
  <div class="button-detail">
    <ion-button class="button-app-principal custom-button">
      <ion-icon slot="start" name="play"></ion-icon>
      Play
    </ion-button>
    <ion-button class="button-app-principal custom-button">
      <ion-icon slot="start" name="shuffle"></ion-icon>
      Shuffle
    </ion-button>
  </div>
  <ion-list class="track-list">
    <ion-item class="custom-item" lines="none">
      <ion-label>
        <span class="track-number">1</span> Forever Outsider
      </ion-label>
      <ion-icon name="cloud-download-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item class="custom-item" lines="none">
      <ion-label>
        <span class="track-number">2</span> Where August Mourn
      </ion-label>
      <ion-icon name="cloud-download-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item class="custom-item" lines="none">
      <ion-label>
        <span class="track-number">3</span> Stories
      </ion-label>
      <ion-icon name="cloud-download-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
